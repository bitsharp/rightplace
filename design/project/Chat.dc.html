<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Chat di gruppo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0B0B12;color:#F2F1F8;font-family:Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <sc-if value="{{ postVis }}" hint-placeholder-val="{{ true }}">
    <a href="GiornoDopo.dc.html" onClick="{{ rememberFrom }}" aria-label="Posta la foto della tua serata" style="position:absolute;left:16px;top:8px;z-index:4;width:40px;height:40px;border-radius:20px;background:#9D6BFF;color:#0B0B12;display:flex;align-items:center;justify-content:center;text-decoration:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </sc-if>

  <div style="flex:none;padding:56px 20px 14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #2A2A3A">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="Serata.dc.html" aria-label="Indietro" style="width:44px;height:44px;border-radius:22px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;display:flex;align-items:center;justify-content:center;text-decoration:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-family:Unbounded,sans-serif;font-weight:700;font-size:17px">Serata da Nome locale</span>
        <span style="font-size:12px;color:#A3A1B8">Solo amici che segui e che vengono</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#15151F;border:1px solid #2A2A3A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ED9C7" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></svg>
      <span style="font-size:13px;line-height:1.4;color:#A3A1B8">La chat si cancella da sola 2 giorni dopo la serata. Le foto arrivano nel feed il giorno dopo.</span>
    </div>
  </div>

  <div style="flex:none;padding:12px 20px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #2A2A3A">
    <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.2px;color:#4ED9C7">{{ galleryLabel }}</span>
    <div style="display:flex;gap:8px;overflow-x:auto">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
        <div style="{{ t.style }}"></div>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px">
    <div style="flex:none;align-self:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.2px;color:#A3A1B8">CHAT CREATA</div>
    <sc-for list="{{ messages }}" as="m" hint-placeholder-count="6">
      <div style="{{ m.wrapStyle }}">
        <sc-if value="{{ m.showName }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:12px;color:#4ED9C7;font-weight:500">{{ m.name }}</span>
        </sc-if>
        <sc-if value="{{ m.isText }}" hint-placeholder-val="{{ true }}">
          <div style="{{ m.bubbleStyle }}">{{ m.text }}</div>
        </sc-if>
        <sc-if value="{{ m.isPhoto }}" hint-placeholder-val="{{ false }}">
          <div style="{{ m.frameStyle }}">
            <div style="{{ m.sceneStyle }}">
              <span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:#F2F1F8AA">FOTO DI ESEMPIO</span>
            </div>
            <sc-if value="{{ m.hasCaption }}" hint-placeholder-val="{{ false }}">
              <div style="padding:10px 12px;font-size:14px;line-height:1.4">{{ m.caption }}</div>
            </sc-if>
          </div>
          <sc-if value="{{ m.isMine }}" hint-placeholder-val="{{ false }}">
            <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:#A3A1B8">VISTA SOLO DAI TUOI FOLLOWER</span>
          </sc-if>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ showTags }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;margin:0 20px 10px;border-radius:14px;background:#15151F;border:1px solid #9D6BFF66;overflow:hidden">
      <div style="padding:10px 14px 4px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.2px;color:#9D6BFF">PUOI TAGGARE SOLO CHI SEGUI</div>
      <sc-for list="{{ tags }}" as="g" hint-placeholder-count="2">
        <button onClick="{{ g.pick }}" style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;background:transparent;color:#F2F1F8;text-align:left;font:500 14px Inter,sans-serif">
          <span style="flex:none;width:32px;height:32px;border-radius:16px;background:#4ED9C733;border:1px solid #4ED9C7;box-sizing:border-box"></span>
          <span style="flex:1">{{ g.label }}</span>
          <span style="font-size:12px;color:#A3A1B8;font-weight:400">Segui</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="flex:none;padding:10px 20px 32px;display:flex;align-items:center;gap:10px;border-top:1px solid #2A2A3A">
    <button onClick="{{ addPhoto }}" aria-label="Aggiungi una foto della serata" style="flex:none;width:48px;height:48px;border-radius:24px;border:1px solid #4ED9C7;background:#4ED9C71A;color:#4ED9C7;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.500"/><path d="M8 6l1.500-2h5L16 6"/></svg>
    </button>
    <label for="msg" style="flex:1;min-width:0;display:flex">
      <input id="msg" type="text" value="{{ msg }}" onInput="{{ onMsg }}" placeholder="Scrivi, @ per taggare" aria-label="Scrivi un messaggio" style="width:100%;height:48px;box-sizing:border-box;padding:0 16px;border-radius:24px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:400 15px Inter,sans-serif">
    </label>
    <button onClick="{{ sendText }}" aria-label="Invia" style="flex:none;width:48px;height:48px;border-radius:24px;border:0;background:#9D6BFF;color:#0B0B12;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Vero se l'utente ha dichiarato una serata (flag condiviso tra le schermate).
  postVis() {
    if (!this._pl) {
      this._pl = true;
      try { window.addEventListener('storage', () => this.setState({ _pv: Date.now() })); } catch (e) { /* ignora */ }
    }
    try { return window.localStorage.getItem('rp_declared') === '1'; } catch (e) { return false; }
  }

  state = { msg: '', sent: [] };

  renderVals() {
    // Foto di esempio: scene a gradienti, non sono immagini reali.
    const scenes = [
      'radial-gradient(circle at 22% 28%,#9D6BFFCC 0,#9D6BFF00 42%),radial-gradient(circle at 80% 20%,#4ED9C7BB 0,#4ED9C700 38%),radial-gradient(circle at 55% 105%,#FF5FA2CC 0,#FF5FA200 55%),#14121F',
      'linear-gradient(180deg,#241649 0%,#7B3F9E 50%,#FF8A5B 82%,#120E1C 82.5%,#120E1C 100%)',
      'radial-gradient(circle at 30% 70%,#4ED9C7AA 0,#4ED9C700 40%),radial-gradient(circle at 70% 40%,#9D6BFFAA 0,#9D6BFF00 45%),linear-gradient(135deg,#0E1B2B,#1B1230)',
      'radial-gradient(circle at 50% 35%,#FFD37A99 0,#FFD37A00 35%),radial-gradient(circle at 15% 85%,#9D6BFFAA 0,#9D6BFF00 40%),#17111F'
    ];
    const seed = [
      { who: 'other', name: 'Volpe Viola', kind: 'text', text: "Ci vediamo davanti all'ingresso?" },
      { who: 'me', kind: 'text', text: 'Sì, io arrivo verso le dieci.' },
      { who: 'other', name: 'Gatto Blu', kind: 'text', text: 'Perfetto, avviso gli altri.' },
      { who: 'other', name: 'Volpe Viola', kind: 'photo', scene: 0, caption: 'Si inizia!' },
      { who: 'me', kind: 'photo', scene: 1, caption: 'Che vista dal rooftop' },
      { who: 'other', name: 'Gatto Blu', kind: 'photo', scene: 2, caption: '' }
    ];
    const all = seed.concat(this.state.sent || []);

    const messages = all.map((m) => {
      const mine = m.who === 'me';
      const photo = m.kind === 'photo';
      return {
        wrapStyle: 'flex:none;max-width:82%;display:flex;flex-direction:column;gap:4px;' + (mine ? 'align-self:flex-end;align-items:flex-end' : 'align-self:flex-start'),
        showName: !mine,
        name: m.name || '',
        isText: !photo,
        text: m.text || '',
        bubbleStyle: mine
          ? 'padding:12px 14px;border-radius:16px 16px 4px 16px;background:#9D6BFF;color:#0B0B12;font-size:15px;line-height:1.4;font-weight:500'
          : 'padding:12px 14px;border-radius:16px 16px 16px 4px;background:#15151F;border:1px solid #2A2A3A;font-size:15px;line-height:1.4',
        isPhoto: photo,
        isMine: mine,
        frameStyle: 'width:230px;border-radius:16px;overflow:hidden;box-sizing:border-box;background:#15151F;border:1px solid ' + (mine ? '#9D6BFF' : '#2A2A3A'),
        sceneStyle: 'height:150px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;background:' + scenes[(m.scene || 0) % scenes.length],
        hasCaption: !!m.caption,
        caption: m.caption || ''
      };
    });

    const photos = all.filter((m) => m.kind === 'photo');
    const thumbs = photos.map((m) => ({
      style: 'flex:none;width:56px;height:56px;border-radius:12px;border:1px solid #2A2A3A;box-sizing:border-box;background:' + scenes[(m.scene || 0) % scenes.length]
    }));

    const msg = this.state.msg || '';
    const tagMatch = /@([\w.]*)$/.exec(msg);
    const tags = tagMatch
      ? ['volpe.viola', 'gatto.blu']
          .filter((t) => t.indexOf(tagMatch[1].toLowerCase()) === 0)
          .map((t) => ({
            label: '@' + t,
            pick: () => this.setState({ msg: msg.replace(/@[\w.]*$/, '@' + t + ' ') })
          }))
      : [];

    return { postVis: this.postVis(), rememberFrom: () => { try { window.localStorage.setItem("rp_from", "Chat.dc.html"); } catch (e) { /* ignora */ } },
      messages: messages,
      thumbs: thumbs,
      galleryLabel: 'FOTO DELLA SERATA · ' + photos.length + ' · SOLO FOLLOWER',
      msg: msg,
      onMsg: (e) => this.setState({ msg: e.target.value }),
      showTags: tags.length > 0,
      tags: tags,
      addPhoto: () => this.setState({
        sent: (this.state.sent || []).concat([{ who: 'me', kind: 'photo', scene: photos.length, caption: '' }])
      }),
      sendText: () => {
        const text = (this.state.msg || '').trim();
        if (!text) return;
        this.setState({
          sent: (this.state.sent || []).concat([{ who: 'me', kind: 'text', text: text }]),
          msg: ''
        });
      }
    };
  }
}
</script>
</body>
</html>
