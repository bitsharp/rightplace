<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;family=Unbounded:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0B0B12;color:#F2F1F8;font-family:Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <dc-import name="TopBar" from="Feed.dc.html" hint-size="390px,170px"></dc-import>

  <div style="flex:none;padding:4px 20px 12px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      
      
    </div>
    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:#15151F;border:1px solid #2A2A3A">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ED9C7" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="8.500"></circle><path d="M12 7.500V12l3 2"></path></svg>
      <span style="font-size:13px;line-height:1.4;color:#A3A1B8">Vedi solo le persone che segui. Le foto di ieri sera arrivano oggi e si cancellano dopo una settimana.</span>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding:4px 20px 16px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
      <div style="flex:none;border-radius:18px;background:#15151F;border:1px solid #2A2A3A;overflow:hidden">
        <div style="display:flex;align-items:center;gap:10px;padding:12px 14px">
          <div style="{{ p.avatarStyle }}"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14px;font-weight:600">{{ p.tag }}</span>
            <span style="font-size:12px;color:#A3A1B8">{{ p.meta }}</span>
          </div>
          <span style="flex:none;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.5px;color:#A3A1B8">{{ p.expires }}</span>
        </div>
        <div style="{{ p.sceneStyle }}">
          <span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:#F2F1F8AA">FOTO DI ESEMPIO</span>
        </div>
        <div style="padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px">
          <sc-if value="{{ p.hasCaption }}" hint-placeholder-val="{{ true }}">
            <span style="font-size:14px;line-height:1.4">{{ p.caption }}</span>
          </sc-if>
          <div style="display:flex;align-items:center;gap:18px">
            <button onClick="{{ p.toggle }}" aria-pressed="{{ p.liked }}" aria-label="Mi piace" style="{{ p.likeStyle }}">
              <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ p.heartStyle }}"><path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10z"></path></svg>
              <span>{{ p.likeCount }}</span>
            </button>
            <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:#A3A1B8">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
              {{ p.comments }}
            </span>
          </div>
        </div>
      </div>
    </sc-for>
    <a href="Amici.dc.html" style="flex:none;text-align:center;font-size:14px;color:#4ED9C7;text-decoration:none;padding:8px 0">Segui altre persone per vedere più foto</a>
  </div>

  <nav style="height:72px;flex:none;box-sizing:border-box;display:flex;border-top:1px solid #2A2A3A;background:#0B0B12">
    <a href="Mappa.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"></path><circle cx="12" cy="9.500" r="2.500"></circle></svg>Mappa</a>
    <a href="Amici.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"></circle><path d="M2.500 20c0-3.600 3-6 6.500-6s6.500 2.400 6.500 6"></path></svg>Amici</a>
    <a href="Chat.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Chat</a>
    <a href="Feed.dc.html" style="flex:1;text-decoration:none;color:#9D6BFF;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="1.500"></circle><path d="M21 15l-5-5L5 21"></path></svg>Feed</a>
    <a href="ProfiloApp.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.500-6.500 8-6.500s8 2.500 8 6.500"></path></svg>Profilo</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Vero se l'utente ha dichiarato una serata (flag condiviso tra le schermate).
  postVis() {
    if (!this._pl) {
      this._pl = true;
      try { window.addEventListener('storage', () => this.setState({ _pv: Date.now() })); } catch (e) { /* ignora */ }
    }
    try { return window.localStorage.getItem('rp_declared') === '1'; } catch (e) { return false; }
  }

  state = { liked: {} };

  renderVals() {
    // Post di esempio (mock): solo persone seguite, serata di ieri.
    const scenes = [
      'radial-gradient(circle at 22% 28%,#9D6BFFCC 0,#9D6BFF00 42%),radial-gradient(circle at 80% 20%,#4ED9C7BB 0,#4ED9C700 38%),radial-gradient(circle at 55% 105%,#FF5FA2CC 0,#FF5FA200 55%),#14121F',
      'linear-gradient(180deg,#241649 0%,#7B3F9E 50%,#FF8A5B 82%,#120E1C 82.5%,#120E1C 100%)',
      'radial-gradient(circle at 30% 70%,#4ED9C7AA 0,#4ED9C700 40%),radial-gradient(circle at 70% 40%,#9D6BFFAA 0,#9D6BFF00 45%),linear-gradient(135deg,#0E1B2B,#1B1230)'
    ];
    const items = [
      { id: 'tu', tag: '@tu', venue: 'Arena Club', scene: 2, caption: 'Serata da ricordare', likes: 4, comments: 1, left: 6, color: '#9D6BFF' },
      { id: 'volpe', tag: '@volpe.viola', venue: 'Arena Club', scene: 0, caption: 'Si inizia!', likes: 12, comments: 3, left: 6, color: '#9D6BFF' },
      { id: 'gatto', tag: '@gatto.blu', venue: 'Sunset Rooftop', scene: 1, caption: 'Che vista dal rooftop', likes: 8, comments: 1, left: 6, color: '#4ED9C7' }
    ];
    const liked = this.state.liked || {};
    return { postVis: this.postVis(), rememberFrom: () => { try { window.localStorage.setItem("rp_from", "Feed.dc.html"); } catch (e) { /* ignora */ } },
      posts: items.map((it) => {
        const on = !!liked[it.id];
        return {
          tag: it.tag,
          meta: it.venue + ' · ieri sera',
          expires: 'SCADE TRA ' + it.left + ' GG',
          avatarStyle: 'flex:none;width:36px;height:36px;border-radius:18px;box-sizing:border-box;background:' + it.color + '33;border:1px solid ' + it.color,
          sceneStyle: 'height:210px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;background:' + scenes[it.scene],
          hasCaption: !!it.caption,
          caption: it.caption,
          liked: on,
          likeCount: it.likes + (on ? 1 : 0),
          comments: it.comments,
          heartStyle: on ? 'fill:currentColor' : 'fill:none',
          likeStyle: 'display:flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;font:500 14px Inter,sans-serif;color:' + (on ? '#9D6BFF' : '#A3A1B8'),
          toggle: () => this.setState({ liked: Object.assign({}, this.state.liked, { [it.id]: !on }) })
        };
      })
    };
  }
}
</script>
</body>
</html>
