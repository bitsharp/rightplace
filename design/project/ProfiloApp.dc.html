<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Profilo (nell app)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;family=Unbounded:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B12;color:#F2F1F8;font-family:Inter,sans-serif;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;min-height:0;box-sizing:border-box;padding:52px 28px 12px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
  <span style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1.5px;color:#9D6BFF">02 / 03 · PROFILO PRIVATO</span>
  <div style="display:flex;flex-direction:column;gap:12px">
    <h1 style="margin:0;font-family:Unbounded,sans-serif;font-weight:700;font-size:26px;line-height:1.2">Dicci chi sei, senza dirlo a nessuno</h1>
    <p style="margin:0;font-size:15px;line-height:1.5;color:#A3A1B8">Agli altri compaiono solo la fascia d'età e il genere.</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="eta" style="font-size:13px;font-weight:500;color:#A3A1B8">Età</label>
    <input id="eta" type="number" value="22" style="height:52px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #9D6BFF;background:#15151F;color:#F2F1F8;font:500 16px Inter,sans-serif">
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:13px;font-weight:500;color:#A3A1B8">Genere</span>
    <div style="display:flex;gap:10px">
      <button style="flex:1;height:48px;border-radius:14px;border:1px solid #9D6BFF;background:#9D6BFF22;color:#F2F1F8;font:600 15px Inter,sans-serif">Donna</button>
      <button style="flex:1;height:48px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 15px Inter,sans-serif">Uomo</button>
      <button style="flex:1;height:48px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 15px Inter,sans-serif">Altro</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#15151F;border:1px solid #2A2A3A">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ED9C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:15px;font-weight:600">Posizione</span>
        <span style="font-size:13px;line-height:1.4;color:#A3A1B8">Ti mostra sulla mappa in base a dove sei</span>
      </div>
      <button role="switch" aria-checked="{{ posOn }}" aria-label="Posizione" onClick="{{ togPos }}" style="{{ posBtn }}"><div style="{{ posKnob }}"></div></button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#15151F;border:1px solid #2A2A3A">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ED9C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.400 6.500 6"></path><path d="M17 5.500a3 3 0 0 1 0 5.500M21.500 19c0-2.500-1.500-4.300-3.500-5"></path></svg>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:15px;font-weight:600">Contatti <span style="font-weight:400;color:#A3A1B8">· facoltativo</span></span>
        <span style="font-size:13px;line-height:1.4;color:#A3A1B8">Per trovare amici da seguire</span>
      </div>
      <button role="switch" aria-checked="{{ conOn }}" aria-label="Contatti" onClick="{{ togCon }}" style="{{ conBtn }}"><div style="{{ conKnob }}"></div></button>
    </div>
  </div>

  <div style="flex:1"></div>
  <a href="Mappa.dc.html" style="height:56px;border-radius:16px;background:#9D6BFF;color:#0B0B12;font:600 16px Inter,sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none">Salva</a>
  <a href="CreatorProfilo.dc.html" style="text-align:center;font-size:14px;color:#4ED9C7;text-decoration:none">Il tuo profilo creator</a>
</div>
  <nav style="height:72px;flex:none;box-sizing:border-box;display:flex;border-top:1px solid #2A2A3A;background:#0B0B12">
    <a href="Mappa.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"></path><circle cx="12" cy="9.500" r="2.500"></circle></svg>Mappa</a>
    <a href="Amici.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.500"></circle><path d="M2.500 20c0-3.600 3-6 6.500-6s6.500 2.400 6.500 6"></path></svg>Amici</a>
    <a href="Chat.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Chat</a>
    <a href="Feed.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="1.500"></circle><path d="M21 15l-5-5L5 21"></path></svg>Feed</a>
    <a href="ProfiloApp.dc.html" style="flex:1;text-decoration:none;color:#9D6BFF;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.500-6.500 8-6.500s8 2.500 8 6.500"></path></svg>Profilo</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pos: true, con: false };

  renderVals() {
    const btn = (on) => 'flex:none;width:46px;height:28px;border-radius:14px;border:0;padding:0 3px;box-sizing:border-box;display:flex;align-items:center;justify-content:' + (on ? 'flex-end' : 'flex-start') + ';background:' + (on ? '#9D6BFF' : '#2A2A3A');
    const knob = (on) => 'width:22px;height:22px;border-radius:11px;background:' + (on ? '#F2F1F8' : '#A3A1B8');
    const pos = this.state.pos !== false;
    const con = !!this.state.con;
    return {
      posOn: pos, conOn: con,
      posBtn: btn(pos), conBtn: btn(con),
      posKnob: knob(pos), conKnob: knob(con),
      togPos: () => this.setState({ pos: !pos }),
      togCon: () => this.setState({ con: !con })
    };
  }
}
</script>
</body>
</html>
