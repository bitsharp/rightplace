    <a href="Amici.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">

    <a href="Chat.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">

    <a href="ProfiloApp.dc.html" style="flex:1;text-decoration:none;color:#A3A1B8;font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Vero se l'utente ha dichiarato una serata (flag condiviso tra le schermate).
  postVis() {
    if (!this._pl) {
      this._pl = true;
      try { window.addEventListener('storage', () => this.setState({ _pv: Date.now() })); } catch (e) { /* ignora */ }
    }
    try { return window.localStorage.getItem('rp_declared') === '1'; } catch (e) { return false; }
  }

  state = { selected: null, view: 'generale', zoom: 1, ox: 0, oy: 0 };

  // Misure del riquadro mappa (corrette per lo zoom della canvas).
  box(e) {
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    const k = el.offsetWidth ? r.width / el.offsetWidth : 1;
    this._g = { left: r.left, top: r.top, k: k || 1, w: el.offsetWidth || 390, h: el.offsetHeight || 370 };
  }

  // Applica zoom e spostamento, tenendo la mappa sempre a riempire il riquadro.
  zoomTo(z, ox, oy) {
    const g = this._g || { w: 390, h: 370 };
    const nz = Math.min(4, Math.max(1, z));
    this.setState({
      zoom: nz,
      ox: Math.min(0, Math.max(g.w * (1 - nz), ox)),
      oy: Math.min(0, Math.max(g.h * (1 - nz), oy))
    });
  }

  // Ingrandisce o riduce di un fattore attorno al punto (lx, ly).
  zoomAt(factor, lx, ly) {
    const z = this.state.zoom || 1;
    const nz = Math.min(4, Math.max(1, z * factor));
    const r = nz / z;
    const ox = this.state.ox || 0;
    const oy = this.state.oy || 0;
    this.zoomTo(nz, lx - (lx - ox) * r, ly - (ly - oy) * r);
  }

  renderVals() {
    const open = (n) => () => {
      if (this._dragged) { this._dragged = false; return; }
      this.setState({ selected: n });
    };
    const gen = this.state.view === 'generale';
    const tabBase = 'flex:1;height:34px;border:0;border-radius:9px;';
    const on = 'background:#9D6BFF;color:#0B0B12;font:600 13px Inter,sans-serif';
    const off = 'background:transparent;color:#A3A1B8;font:500 13px Inter,sans-serif';
    const wrapBase = 'position:absolute;left:0;top:0;right:0;bottom:0;';
    const cardsBase = 'padding:14px 20px 10px;flex:1;min-height:0;box-sizing:border-box;overflow-y:auto;flex-direction:column;gap:10px;';
    return { postVis: this.postVis(), rememberFrom: () => { try { window.localStorage.setItem("rp_from", "Mappa.dc.html"); } catch (e) { /* ignora */ } },
      isGen: gen,
      isFri: !gen,
      tabGen: tabBase + (gen ? on : off),
      tabFri: tabBase + (gen ? off : on),
      setGen: () => this.setState({ view: 'generale' }),
      setFri: () => this.setState({ view: 'amici' }),
      genSvg: gen ? 'display:inline' : 'display:none',
      friSvg: gen ? 'display:none' : 'display:inline',
      genWrap: wrapBase + (gen ? '' : 'display:none'),
      friWrap: wrapBase + (gen ? 'display:none' : ''),
      genCards: cardsBase + (gen ? 'display:flex' : 'display:none'),
      friCards: cardsBase + (gen ? 'display:none' : 'display:flex'),
      hint: gen ? 'TOCCA UN PUNTO CALDO · PIZZICA PER ZOOM' : 'DOVE VANNO I TUOI AMICI · PIZZICA PER ZOOM',
      mapLabel: gen ? 'Mappa con punti caldi di affluenza' : 'Mappa con i locali dove vanno gli amici che segui',
      selected: this.state.selected || '',
      hasSelected: !!this.state.selected,
      close: () => this.setState({ selected: null }),
      openArena: open('Arena Club'),
      openSunset: open('Sunset Rooftop'),
      openCala: open('La Cala Bar'),
      openVegueta: open('Vegueta Live'),
      zoomStyle: 'position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transform:translate(' + Math.round((this.state.ox || 0) * 10) / 10 + 'px,' + Math.round((this.state.oy || 0) * 10) / 10 + 'px) scale(' + (this.state.zoom || 1) + ')',
      zoomIn: () => {
        const g = this._g || { w: 390, h: 370 };
        this.zoomAt(1.5, g.w / 2, g.h / 2);
      },
      zoomOut: () => {
        const g = this._g || { w: 390, h: 370 };
        this.zoomAt(1 / 1.5, g.w / 2, g.h / 2);
      },
      ptrDown: (e) => {
        this.box(e);
        const p = this._p = this._p || {};
        if (Object.keys(p).length === 0) { this._dragged = false; this._travel = 0; }
        p[e.pointerId] = { x: e.clientX, y: e.clientY };
      },
      ptrMove: (e) => {
        const p = this._p || {};
        const cur = p[e.pointerId];
        if (!cur) return;
        const g = this._g || { left: 0, top: 0, k: 1 };
        const ids = Object.keys(p);
        if (ids.length >= 2) {
          // Pizzico: due dita cambiano lo zoom attorno al loro punto medio.
          const other = p[ids.filter((i) => String(i) !== String(e.pointerId))[0]];
          const pd = Math.hypot(cur.x - other.x, cur.y - other.y);
          const pmx = (cur.x + other.x) / 2;
          const pmy = (cur.y + other.y) / 2;
          cur.x = e.clientX;
          cur.y = e.clientY;
          const nd = Math.hypot(cur.x - other.x, cur.y - other.y);
          const nmx = (cur.x + other.x) / 2;
          const nmy = (cur.y + other.y) / 2;
          this._dragged = true;
          if (pd > 0) {
            const z = this.state.zoom || 1;
            const nz = Math.min(4, Math.max(1, z * nd / pd));
            const r = nz / z;
            const lx = (nmx - g.left) / g.k;
            const ly = (nmy - g.top) / g.k;
            const ox = this.state.ox || 0;
            const oy = this.state.oy || 0;
            this.zoomTo(nz, lx - (lx - ox) * r + (nmx - pmx) / g.k, ly - (ly - oy) * r + (nmy - pmy) / g.k);
          }
        } else {
          // Un dito (o il mouse): sposta la mappa quando è ingrandita.
          const dx = e.clientX - cur.x;
          const dy = e.clientY - cur.y;
          cur.x = e.clientX;
          cur.y = e.clientY;
          this._travel = (this._travel || 0) + Math.abs(dx) + Math.abs(dy);
          if (this._travel > 6 && (this.state.zoom || 1) > 1) {
            this._dragged = true;
            this.zoomTo(this.state.zoom, (this.state.ox || 0) + dx / g.k, (this.state.oy || 0) + dy / g.k);
          }
        }
      },
      ptrUp: (e) => {
        if (this._p) delete this._p[e.pointerId];
      },
      onWheel: (e) => {
        // Pizzico sul trackpad (ctrl o cmd + rotellina).
        if (!(e.ctrlKey || e.metaKey)) return;
        try { e.preventDefault(); } catch (err) { /* evento passivo */ }
        this.box(e);
        const g = this._g;
        this.zoomAt(Math.exp(-e.deltaY * 0.01), (e.clientX - g.left) / g.k, (e.clientY - g.top) / g.k);
      }
    };
  }
}
</script>
