<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Crea serata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0B0B12;color:#F2F1F8;font-family:Inter,sans-serif;padding:56px 20px 28px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

  <span style="font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1.5px;color:#4ED9C7">CREATOR · NUOVA SERATA</span>
  <h1 style="margin:0;font-family:Unbounded,sans-serif;font-weight:700;font-size:24px;line-height:1.2">Crea una serata</h1>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="luogo" style="font-size:13px;font-weight:500;color:#A3A1B8">Luogo</label>
    <input id="luogo" type="text" placeholder="Scegli un locale da Google Maps" style="height:50px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:400 15px Inter,sans-serif">
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="nome" style="font-size:13px;font-weight:500;color:#A3A1B8">Nome della serata</label>
    <input id="nome" type="text" placeholder="Dai un nome alla serata" style="height:50px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:400 15px Inter,sans-serif">
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="descr" style="font-size:13px;font-weight:500;color:#A3A1B8">Descrizione</label>
    <textarea id="descr" rows="3" placeholder="Di cosa si tratta?" style="box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:400 15px Inter,sans-serif;resize:none"></textarea>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="ora" style="font-size:13px;font-weight:500;color:#A3A1B8">Orario</label>
    <input id="ora" type="time" value="22:00" style="height:50px;box-sizing:border-box;padding:0 16px;border-radius:14px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:400 15px Inter,sans-serif">
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:13px;font-weight:500;color:#A3A1B8">Per chi</span>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #9D6BFF;background:#9D6BFF22;color:#F2F1F8;font:600 14px Inter,sans-serif">18–24</button>
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 14px Inter,sans-serif">25–34</button>
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 14px Inter,sans-serif">35+</button>
    </div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #9D6BFF;background:#9D6BFF22;color:#F2F1F8;font:600 14px Inter,sans-serif">Tutti</button>
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 14px Inter,sans-serif">Donne</button>
      <button style="flex:1;height:44px;border-radius:12px;border:1px solid #2A2A3A;background:#15151F;color:#F2F1F8;font:500 14px Inter,sans-serif">Uomini</button>
    </div>
  </div>

  <div style="flex:1"></div>
  <a href="Abbonamento.dc.html" style="height:56px;border-radius:16px;background:#4ED9C7;color:#0B0B12;font:600 16px Inter,sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none">Pubblica la serata</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
